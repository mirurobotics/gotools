name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  lint:
    timeout-minutes: 10
    name: lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./go.mod

      - name: Run Linters
        run: LINT_FIX=0 ./scripts/lint.sh

  test:
    timeout-minutes: 10
    name: test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./go.mod

      - name: Run Tests
        run: ./scripts/covgate.sh

  surface-lint:
    # yamllint disable-line rule:line-length
    uses: mirurobotics/.github/.github/workflows/surface-lint.yml@6472b6d5b762eb9246ceb094d0912883e04081a1
    with:
      runs-on: blacksmith-4vcpu-ubuntu-2404
