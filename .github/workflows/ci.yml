name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  lint:
    # yamllint disable-line rule:line-length
    uses: mirurobotics/workflows/.github/workflows/go-lint.yml@1e64700bcb129a0be241e095713c161a79b26a37
    with:
      miru: go run ./cmd/miru

  test:
    # yamllint disable-line rule:line-length
    uses: mirurobotics/workflows/.github/workflows/go-test.yml@1e64700bcb129a0be241e095713c161a79b26a37
    with:
      miru: go run ./cmd/miru

  surface-lint:
    # yamllint disable-line rule:line-length
    uses: mirurobotics/workflows/.github/workflows/surface-lint.yml@91242ae4961722392281f2e0cc5895458186c817
    with:
      runs-on: ubuntu-latest # standard GitHub-hosted runners are free in public repos
