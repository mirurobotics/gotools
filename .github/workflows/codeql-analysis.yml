name: CodeQL

on:
  schedule:
    - cron: '31 7 * * *'
  workflow_dispatch:

permissions:
  actions: read
  checks: write
  contents: read
  security-events: write

jobs:
  changes:
    name: Check for new commits
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      scan: ${{ steps.check.outputs.scan }}
    steps:
      # The nightly run skips the scan when main hasn't moved since the last
      # successful run, so quiet repos don't rescan the same commit.
      - name: Check for commits since the last scan
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          scan=true
          if [ "$EVENT" = "schedule" ]; then
            workflow_id=$(gh api "repos/$REPO/actions/runs/$RUN_ID" \
              --jq .workflow_id) || true
            runs="repos/$REPO/actions/workflows/$workflow_id/runs"
            last_sha=$(gh api "$runs?branch=main&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // ""') || true
            if [ -n "$last_sha" ] && [ "$last_sha" = "$SHA" ]; then
              echo "main is still at $SHA, which was already scanned."
              scan=false
            fi
          fi
          echo "scan=$scan" >> "$GITHUB_OUTPUT"

  codeql:
    needs: changes
    if: needs.changes.outputs.scan == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: ./go.mod

      - name: Initialize CodeQL
        # yamllint disable rule:line-length
        uses: github/codeql-action/init@38697555549f1db7851b81482ff19f1fa5c4fedc # v4
        with:
          languages: go

      - name: Autobuild
        # yamllint disable rule:line-length
        uses: github/codeql-action/autobuild@38697555549f1db7851b81482ff19f1fa5c4fedc # v4

      - name: Perform CodeQL Analysis
        # yamllint disable rule:line-length
        uses: github/codeql-action/analyze@38697555549f1db7851b81482ff19f1fa5c4fedc # v4
